<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NeonCord - Giriş / Kayıt</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #18191c;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #faa61a;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: #b9bbbe;
        }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 10px;
            background-color: #2f3136;
            border: 1px solid #202225;
            border-radius: 4px;
            color: #fff;
            box-sizing: border-box;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin: 15px 0;
            font-size: 14px;
            color: #b9bbbe;
            cursor: pointer;
        }
        .checkbox-container input {
            margin-right: 8px;
            accent-color: #faa61a;
            cursor: pointer;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #faa61a;
            border: none;
            border-radius: 4px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }
        .btn:hover {
            background-color: #e59415;
        }
        #error-message {
            color: #ed4245;
            font-size: 13px;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">⚡ NeonCord</div>
    
    <form id="authForm" action="api.php" method="POST">
        <div class="form-group">
            <label>Kullanıcı Adı veya E-Posta</label>
            <input type="text" name="identity" required placeholder="syvex veya syvex@gmail.com">
        </div>
        
        <div class="form-group">
            <label>Şifre</label>
            <input type="password" name="password" required placeholder="••••••••••••">
        </div>

        <!-- Keep Signed In (Beni Hatırla) Eklendi -->
        <div class="checkbox-container">
            <input type="checkbox" id="keepSigned" name="keep_signed" value="1">
            <label for="keepSigned" style="margin-bottom: 0; color: #b9bbbe; display: inline;">Oturumu açık tut (Beni Hatırla)</label>
        </div>

        <button type="submit" class="btn">Giriş Yap / Kayıt Ol</button>
        <div id="error-message"></div>
    </form>
</div>

</body>
</html>
