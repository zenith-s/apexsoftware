<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NEON SOFTWARE - Yönetim Paneli</title>
    <style>
        body { background-color: #0b0f19; color: #38bdf8; font-family: monospace; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .panel-box { background: #111827; border: 2px solid #1e3a8a; border-radius: 12px; width: 900px; padding: 25px; box-shadow: 0 0 25px rgba(56, 189, 248, 0.15); }
        h2 { color: #f43f5e; margin-top: 0; font-size: 20px; }
        .info-bar { margin-bottom: 20px; font-size: 14px; color: #94a3b8; }
        .info-bar span { color: #22c55e; font-weight: bold; }
        .btn-group { margin-bottom: 25px; display: flex; gap: 10px; }
        button { padding: 10px 18px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; }
        .btn-green { background-color: #16a34a; }
        .btn-red { background-color: #dc2626; }
        .btn-blue { background-color: #2563eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #1f2937; font-size: 13px; }
        th { color: #38bdf8; }
        td { color: #e2e8f0; }
        .status-active { color: #22c55e; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel-box">
    <h2>NEON SOFTWARE</h2>
    <div class="info-bar">
        Canlı Cihaz Yönetimi | Aktif Cihaz Sayısı: <span id="deviceCount">0</span>
    </div>

    <div class="btn-group">
        <button class="btn-green">Tüm PC'lerde Sistemi Aç</button>
        <button class="btn-red">Tüm PC'lerde Servisi Kapat</button>
        <button class="btn-blue">Tümüne Güncelleme Getir (.exe)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Bilgisayar Adı (PC)</th>
                <th>HWID</th>
                <th>Sunucu Durumu</th>
                <th>İşlem / Menü</th>
            </tr>
        </thead>
        <tbody id="deviceTableBody">
            <tr><td colspan="4" style="text-align: center; color: #64748b;">Bağlı cihaz aranıyor...</td></tr>
        </tbody>
    </table>
</div>

<script>
    function fetchDevices() {
        fetch('api.php?action=get_devices')
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('deviceCount').innerText = data.count;
                    let tbody = document.getElementById('deviceTableBody');
                    tbody.innerHTML = '';

                    if (data.devices.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: #64748b;">Aktif cihaz bulunmuyor.</td></tr>';
                        return;
                    }

                    data.devices.forEach(dev => {
                        let row = `<tr>
                            <td>${dev.pc_name}</td>
                            <td>${dev.hwid}</td>
                            <td><span class="status-active">Aktif (PID: ${dev.pid})</span></td>
                            <td><button class="btn-red" style="padding: 5px 10px; font-size: 11px;">İşlem Yap</button></td>
                        </tr>`;
                        tbody.innerHTML += row;
                    });
                }
            })
            .catch(err => console.error('Veri çekme hatası:', err));
    }

    // Her 3 saniyede bir cihaz listesini güncelle
    setInterval(fetchDevices, 3000);
    fetchDevices();
</script>

</body>
</html>
