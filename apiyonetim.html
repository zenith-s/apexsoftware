<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NEON SOFTWARE // ADMIN PANEL</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            text-shadow: 0 0 10px #00ffcc;
            letter-spacing: 2px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #111827;
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            padding: 20px;
            border-radius: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #1f2937;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #1f2937;
            color: #00ffcc;
        }
        tr:hover {
            background-color: rgba(0, 255, 204, 0.05);
        }
        .badge-active {
            color: #10b981;
            font-weight: bold;
        }
        .badge-waiting {
            color: #f59e0b;
        }
        .badge-offline {
            color: #ef4444;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            border-radius: 3px;
        }
        button:hover {
            background: #dc2626;
        }
        .refresh-info {
            text-align: right;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ NEON SOFTWARE // COMMAND CENTER ⚡</h1>
        <div class="refresh-info" id="status-timer">Durum: Güncelleniyor...</div>

        <table>
            <thead>
                <tr>
                    <th>Bilgisayar Adı</th>
                    <th>HWID</th>
                    <th>Target PID</th>
                    <th>Durum (Bypass / Oyun)</th>
                    <th>Bağlantı</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody id="client-table-body">
                <tr><td colspan="6" style="text-align: center;">Yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        function fetchClients() {
            fetch('api.php?action=get_clients')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('client-table-body');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center;">Aktif cihaz bulunamadı.</td></tr>';
                        return;
                    }

                    data.forEach(client => {
                        let row = document.createElement('tr');

                        let stateBadge = client.vgk_state === 'active' 
                            ? '<span class="badge-active">OYUNDA (ACTIVE)</span>' 
                            : '<span class="badge-waiting">BEKLİYOR (WAITING)</span>';

                        let onlineBadge = client.online 
                            ? '<span class="badge-active">ÇEVRİM İÇİ</span>' 
                            : '<span class="badge-offline">ÇEVRİM DIŞI</span>';

                        row.innerHTML = `
                            <td>${client.pc_name}</td>
                            <td style="font-size: 11px; color: #9ca3af;">${client.hwid}</td>
                            <td>${client.pid > 0 ? client.pid : '-'}</td>
                            <td>${stateBadge}</td>
                            <td>${onlineBadge}</td>
                            <td><button onclick="sendCommand('${client.hwid}', 'close')">Kapat / Close</button></td>
                        `;
                        tbody.appendChild(row);
                    });
                    document.getElementById('status-timer').innerText = "Son Güncelleme: " + new Date().toLocaleTimeString();
                })
                .catch(err => console.error('Veri çekme hatası:', err));
        }

        function sendCommand(hwid, cmd) {
            if (!confirm(hwid + " kimlikli cihaza kapatma komutu gönderilsin mi?")) return;

            let formData = new FormData();
            formData.append('action', 'send_cmd');
            formData.append('hwid', hwid);
            formData.append('cmd', cmd);

            fetch('api.php', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(res => {
                alert("Komut iletildi!");
                fetchClients();
            });
        }

        // Her 4 saniyede bir tabloyu otomatik yenile
        setInterval(fetchClients, 4000);
        fetchClients();
    </script>
</body>
</html>
