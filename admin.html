<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Neon Security System</title>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #141414; border: 1px solid #262626; padding: 35px; border-radius: 10px; width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; }
        h2 { color: #dc143c; margin-bottom: 5px; letter-spacing: 1.5px; }
        p { color: #777; font-size: 12px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #1f1f1f; border: 1px solid #333; color: #fff; border-radius: 5px; box-sizing: border-box; text-align: center; font-weight: bold; }
        button { width: 100%; padding: 12px; background: #dc143c; border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #b01030; }
        .result { margin-top: 20px; font-size: 13px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="card">
        <h2>NEON SECURITY</h2>
        <p>License & Authentication Panel</p>
        <input type="text" id="keyInput" placeholder="NEON-XXXX-XXXX-XXXX">
        <button onclick="verifyKey()">DÖNÜŞÜ KONTROL ET</button>
        <div class="result" id="res"></div>
    </div>
    <script>
        function verifyKey() {
            const key = document.getElementById('keyInput').value;
            const res = document.getElementById('res');
            if(!key) { res.style.color = '#ff4444'; res.innerText = "Lütfen bir key girin!"; return; }
            res.style.color = '#f1c40f';
            res.innerText = "Sunucu ile bağlantı kuruluyor...";
            
            fetch(`api.php?action=verify&key=${key}&hwid=WEB-TEST&pc_name=BROWSER`)
                .then(r => r.text())
                .then(data => {
                    if(data.startsWith("SUCCESS")) {
                        res.style.color = '#2ecc71';
                        res.innerText = "Lisans Aktif! Kalan Süre: " + data.split('|')[1];
                    } else {
                        res.style.color = '#e74c3c';
                        res.innerText = "Hata: " + data;
                    }
                }).catch(() => {
                    res.style.color = '#e74c3c';
                    res.innerText = "Sunucu uykuda veya bağlantı hatası!";
                });
        }
    </script>
</body>
</html>
