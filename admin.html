<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>NEON SOFTWARE // ADMIN PANEL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap');
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #020408; color: #fff; font-family: 'Orbitron', sans-serif; padding: 30px; }
.panel { background: rgba(6, 10, 18, 0.94); border: 1px solid rgba(0,246,255,0.2); padding: 25px; margin-bottom: 20px; }
h2 { color: #00f6ff; font-size: 14px; margin-bottom: 15px; letter-spacing: 2px; }
.form-row { display: flex; gap: 15px; align-items: flex-end; }
.input-group { flex: 1; display: flex; flex-direction: column; gap: 5px; }
label { font-size: 8px; color: #72828c; }
select, input { height: 40px; background: #000; border: 1px solid #1a3c44; color: #00f6ff; padding: 0 10px; font-family: 'JetBrains Mono'; }
button { height: 40px; padding: 0 20px; background: rgba(0,246,255,0.15); border: 1px solid #00f6ff; color: #fff; cursor: pointer; font-family: inherit; font-size: 9px; letter-spacing: 2px; }
button:hover { background: rgba(0,246,255,0.3); }
table { width: 100%; border-collapse: collapse; font-family: 'JetBrains Mono'; font-size: 11px; margin-top: 10px; }
th { text-align: left; padding: 10px; background: rgba(0,246,255,0.05); color: #00f6ff; border-bottom: 1px solid rgba(0,246,255,0.2); }
td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); color: #a8b8c2; }
.action { color: #ff3158; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<div class="panel">
    <h2>YENİ LİSANS ÜRET (1 DK / 30 DK / 1 SAAT)</h2>
    <div class="form-row">
        <div class="input-group">
            <label>SÜRE SEÇ</label>
            <select id="durationSelect">
                <option value="60|1 Dakika">1 Dakika (Test)</option>
                <option value="1800|30 Dakika">30 Dakika</option>
                <option value="3600|1 Saat" selected>1 Saat</option>
                <option value="86400|24 Saat">24 Saat</option>
            </select>
        </div>
        <button onclick="createKey()">KEY OLUŞTUR</button>
    </div>
</div>

<div class="panel">
    <h2>AKTİF LİSTELER VE HWID KONTROLÜ</h2>
    <table>
        <thead>
            <tr>
                <th>LİSANS ANAHTARI</th>
                <th>SÜRE</th>
                <th>BAĞLI HWID</th>
                <th>İŞLEM</th>
            </tr>
        </thead>
        <tbody id="keyTable"></tbody>
    </table>
</div>

<script>
async function loadKeys() {
    let res = await fetch('api.php?action=get_data');
    let data = await res.json();
    let tbody = document.getElementById('keyTable');
    tbody.innerHTML = '';
    data.forEach(item => {
        tbody.innerHTML += `
            <tr>
                <td style="color: #00f6ff; font-weight:bold;">${item.key}</td>
                <td>${item.duration_text}</td>
                <td>${item.hwid || '<span style="color:#555">Boşta</span>'}</td>
                <td><span class="action" onclick="resetHwid('${item.key}')">HWID Sıfırla</span></td>
            </tr>`;
    });
}

async function createKey() {
    let val = document.getElementById('durationSelect').value.split('|');
    let formData = new URLSearchParams();
    formData.append('action', 'create');
    formData.append('duration_sec', val[0]);
    formData.append('duration_text', val[1]);

    let res = await fetch('api.php', { method: 'POST', body: formData });
    let result = await res.json();
    if(result.status === 'success') {
        alert('Oluşturulan Key: ' + result.key);
        loadKeys();
    }
}

async function resetHwid(key) {
    let formData = new URLSearchParams();
    formData.append('action', 'reset_hwid');
    formData.append('key', key);
    await fetch('api.php', { method: 'POST', body: formData });
    loadKeys();
}

loadKeys();
setInterval(loadKeys, 5000); // 5 saniyede bir otomatik yenile
</script>
</body>
</html>
