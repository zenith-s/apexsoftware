<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Neon Security - Admin Paneli</title>
    <style>
        body { background: #0f172a; color: #f8fafc; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: #1e293b; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #38bdf8; text-align: center; }
        .box { background: #334155; padding: 15px; margin-bottom: 15px; border-radius: 6px; }
        input, button { padding: 8px 12px; margin: 5px 0; border-radius: 4px; border: none; font-size: 14px; }
        input { background: #0f172a; color: #fff; border: 1px solid #475569; width: calc(100% - 20px); max-width: 300px; }
        button { background: #2563eb; color: #white; cursor: pointer; font-weight: bold; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #475569; padding: 8px; text-align: left; font-size: 13px; }
        th { background: #0f172a; color: #38bdf8; }
        .danger { background: #dc2626; }
        .danger:hover { background: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Neon Security Panel</h1>

    <!-- Yetkilendirme Ayarı -->
    <div class="box">
        <h3>Bağlantı Ayarları</h3>
        <label>API URL:</label><br>
        <input type="text" id="apiUrl" value="https://neonsoftwarecrackme.onrender.com/api.php"><br>
        <label>Admin Token:</label><br>
        <input type="password" id="adminToken" value="ADMIN_GIZLI_TOKEN_123">
        <br><button onclick="loadData()">Verileri Yenile</button>
    </div>

    <!-- Lisans Üretme -->
    <div class="box">
        <h3>Yeni Lisans Üret</h3>
        <input type="text" id="genPrefix" value="NEON" placeholder="Örn: NEON"><br>
        <input type="number" id="genCount" value="1" placeholder="Adet"><br>
        <input type="number" id="genDays" value="30" placeholder="Gün Süresi"><br>
        <br><button onclick="generateKeys()">Key Üret</button>
    </div>

    <!-- Lisans Listesi -->
    <div class="box">
        <h3>Lisanslar</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Key</th>
                    <th>HWID</th>
                    <th>Son IP</th>
                    <th>Durum</th>
                    <th>Bitiş Tarihi</th>
                    <th>İşlemler</th>
                </tr>
            </thead>
            <tbody id="licenseTable">
                <tr><td colspan="7" style="text-align:center;">Veriler yükleniyor...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
async function sendRequest(actionData) {
    const url = document.getElementById('apiUrl').value;
    const token = document.getElementById('adminToken').value;
    
    actionData.admin_token = token;

    try {
        let response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(actionData)
        });
        let result = await response.json();
        return result;
    } catch (err) {
        alert("Sunucuya bağlanılamadı! URL veya CORS hatası.");
        console.error(err);
        return null;
    }
}

async function loadData() {
    let res = await sendRequest({ action: 'admin_get_all' });
    if (!res || res.status !== 'success') return;

    let tbody = document.getElementById('licenseTable');
    tbody.innerHTML = '';

    res.licenses.forEach(l => {
        let tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${l.id}</td>
            <td><b>${l.license_key}</b></td>
            <td>${l.hwid || 'Bağlı Değil'}</td>
            <td>${l.last_ip || '-'}</td>
            <td>${l.status}</td>
            <td>${l.expiry_date || 'Sınırsız'}</td>
            <td>
                <button onclick="resetHwid(${l.id})">HWID Sıfırla</button>
                <button class="danger" onclick="deleteKey(${l.id})">Sil</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

async function generateKeys() {
    let prefix = document.getElementById('genPrefix').value;
    let count = parseInt(document.getElementById('genCount').value);
    let days = parseInt(document.getElementById('genDays').value);

    let res = await sendRequest({
        action: 'admin_generate_keys',
        prefix: prefix,
        count: count,
        days: days
    });

    if (res && res.status === 'success') {
        alert(count + " adet key başarıyla üretildi!");
        loadData();
    } else {
        alert("Hata: " + (res ? res.message : "Bilinmeyen hata"));
    }
}

async function resetHwid(id) {
    if(!confirm("Bu lisansın HWID kilidini sıfırlamak istiyor musunuz?")) return;
    await sendRequest({ action: 'admin_reset_hwid', id: id });
    loadData();
}

async function deleteKey(id) {
    if(!confirm("Bu lisansı tamamen silmek istiyor musunuz?")) return;
    await sendRequest({ action: 'admin_delete_license', id: id });
    loadData();
}

// Sayfa açıldığında verileri otomatik çek
window.onload = loadData;
</script>

</body>
</html>
