<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON COMMAND CENTER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0f18; color: #e2e8f0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #131722; padding: 20px; border-radius: 12px; border: 1px solid #1e2638; margin-bottom: 20px; }
        .logo-area { display: flex; align-items: center; gap: 12px; }
        .logo-icon { background: linear-gradient(135deg, #ff3366, #ff6b6b); width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; }
        .logo-text h1 { font-size: 18px; letter-spacing: 1px; color: #fff; }
        .logo-text p { font-size: 12px; color: #8c9bae; }
        .status-badge { background: #0f2922; color: #10b981; border: 1px solid #065f46; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .stat-card { background: #131722; padding: 20px; border-radius: 12px; border: 1px solid #1e2638; position: relative; }
        .stat-card p { color: #8c9bae; font-size: 13px; margin-bottom: 8px; }
        .stat-card h2 { font-size: 28px; color: #fff; }
        
        .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .panel { background: #131722; padding: 20px; border-radius: 12px; border: 1px solid #1e2638; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .panel-header h3 { font-size: 15px; color: #fff; }
        
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; font-size: 13px; border-bottom: 1px solid #1e2638; color: #94a3b8; }
        th { color: #64748b; font-weight: 600; }
        
        .logs-box { background: #090b10; border: 1px solid #1e2638; border-radius: 8px; padding: 15px; height: 250px; overflow-y: auto; font-family: monospace; font-size: 12px; color: #10b981; }
        .log-item { margin-bottom: 6px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-area">
            <div class="logo-icon">🛡️</div>
            <div class="logo-text">
                <h1>NEON COMMAND CENTER</h1>
                <p>SECURE LICENSE & CLIENT MANAGER</p>
            </div>
        </div>
        <div class="status-badge">🟢 API & GATEWAY ACTIVE</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <p>TOPLAM LİSANS KEY</p>
            <h2 id="total-keys">0</h2>
        </div>
        <div class="stat-card">
            <p>AKTİF CİHAZLAR</p>
            <h2 id="total-devices">0</h2>
        </div>
        <div class="stat-card">
            <p>TOPLAM İSTEK (LOG)</p>
            <h2 id="total-logs">0</h2>
        </div>
    </div>

    <div class="main-grid">
        <div class="panel">
            <div class="panel-header">
                <h3>Lisans Anahtarları</h3>
                <button class="btn" onclick="generateKey()">+ Yeni Key Üret</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Lisans Key</th>
                        <th>Açıklama / Not</th>
                        <th>Kilitli HWID</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody id="keys-table">
                    <tr><td colspan="4" style="text-align: center;">Veriler yükleniyor...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h3>Canlı API İstek Logları</h3>
            </div>
            <div class="logs-box" id="logs-box">
                <div class="log-item">[System] Bağlantı bekleniyor...</div>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                let response = await fetch('api.php?action=get_data');
                let data = await response.json();
                
                document.getElementById('total-keys').innerText = data.keys.length;
                document.getElementById('total-devices').innerText = data.devices.length;
                document.getElementById('total-logs').innerText = data.logs.length;

                let tbody = document.getElementById('keys-table');
                if (data.keys.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align: center;">Henüz lisans key üretilmemiş.</td></tr>`;
                } else {
                    tbody.innerHTML = data.keys.map(k => `
                        <tr>
                            <td><code>${k.license_key}</code></td>
                            <td>${k.note || 'Normal Key'}</td>
                            <td>${k.hwid || 'Kilitli Değil'}</td>
                            <td><span style="color: ${k.status === 'Aktif' ? '#10b981' : '#ef4444'}">${k.status}</span></td>
                        </tr>
                    `).join('');
                }

                let logsBox = document.getElementById('logs-box');
                logsBox.innerHTML = data.logs.map(l => `<div class="log-item">[${l.time}] ${l.message}</div>`).join('');
            } catch (err) {
                console.error("Veri çekme hatası:", err);
            }
        }

        async function generateKey() {
            try {
                let res = await fetch('api.php?action=generate_key', { method: 'POST' });
                let result = await res.json();
                if(result.success) {
                    loadData();
                } else {
                    alert("Key üretilemedi!");
                }
            } catch (err) {
                alert("Bağlantı hatası!");
            }
        }

        // Sayfa açıldığında ve her 3 saniyede bir verileri tazele
        loadData();
        setInterval(loadData, 3000);
    </script>
</body>
</html>
